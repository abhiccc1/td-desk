[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "td-desk-gateway"
version = "0.1.0"
description = "TD-Desk API Gateway – unified REST/WebSocket entry-point"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "wsproto>=1.2",
    "redis>=5.0",
    "httpx>=0.27",
    "orjson>=3.10",
    "kotakneoapi>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
