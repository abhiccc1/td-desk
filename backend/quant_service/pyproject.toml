[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "td-desk-quant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "riskfolio-lib>=6.0",
    "polars>=1.0",
    "redis>=5.0",
    "numpy",
    "scipy>=1.12",
    "structlog>=24.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "maturin>=1.0",
]
