[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "td-desk-session-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "orjson>=3.10",
    "fastapi>=0.115",
]

[tool.hatch.build.targets.wheel]
packages = ["session_broker"]
